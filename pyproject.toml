[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
packages = ["src", "tests"]

[tool.coverage.run]
omit = ["src/gui.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true


[tool.ruff.lint.per-file-ignores]
"src/web_app.py" = ["E501"]
